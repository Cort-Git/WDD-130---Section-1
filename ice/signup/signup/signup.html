<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
        }
        body {
            background-color: rgb(120, 96, 64);;
        }
        .jesus {
            width: 500px;
            display: block
        }
        #myForm {
            display: grid;
           
            background-color: white;
        }
        #formContainer {
            background-color: white;
            color: black;
            margin: 30px auto;
            max-width: 500px;
            border: 10px solid darkblue;
        }
        #closeBtn {
            grid-column: 1/2;
        }
        #username {
            grid-column: 1/2
        }
        #email {
            grid-column: 1/2
        }
        #male {
            grid-column: 1/2
        }
        #female {
            grid-column: 1/2
        }
        #conditions {
            grid-column: 1/2
        }
        #title {
            color: white;
            font-size: 30;
            margin-top: -38px;
            font-family: 'Times New Roman', Times, serif;
        }
        #scripture {
            color: white;
            font-size: 15;
            font-family:'Times New Roman', Times, serif;
        }
        .oldtestament {
            width: 80px;
            margin-top: 20px;
        }
        .newtestament {
            width: 80px;
            margin-left: 90px;
            margin-top: -120px;
            margin-bottom: 18px;
        }
        .bom {
            width: 80px;
            margin-left: 180px;
            margin-top: -220px;
            margin-bottom: 36px;
        }
        .doctrine {
            width: 80px;
            margin-left: 270px;
            margin-top: -320px;
            margin-bottom: 54px;
        }
        .pearl {
            width: 80px;
            margin-left: 360px;
            margin-top: -420px;
            margin-bottom: 72px;
        }

    </style>





</head>


<body>


    <div id="formContainer">
        <a id="Jesus Feeds" href="index.html">
        <img class="jesus" src="images/jesus_feeds_5000.jpeg" alt="Jesus Feeds 5000">
        </a>
        <div id ="title"><p>Daily Feed</p>
        </div>
        <div id="scripture"><p>Scripture a Day</p>
        </div>
        <h3>Sign Up for Daily Scripture Feed</h3>
        <form id="myForm">
            <button type="button" id="closeBtn">X</button>
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>
            

            <section>
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section>
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section>
                <button type="submit">Submit</button>
            </section>
            <a id="OldTestament" href="index.html">
            <img class="oldtestament" src="images/old_testament.webp" alt="Old Testament">
            </a>
            <a id="NewTestament" href="index.html">
            <img class="newtestament" src="images/new_testament.webp" alt="New Testament">
            </a>
            <a id="Book Mormon" href="index.html">
            <img class="bom" src="images/book_of_mormon.webp" alt="Book of Mormon">
            </a>
            <a id="D&C" href="index.html">
            <img class="doctrine" src="images/doctrine_and_covenants.webp" alt="Doctrine and Covenants">
            </a>
            <a id="Pearl" href="index.html">
            <img class="pearl" src="images/pearl_of_great_price.webp" alt="Pearl of Great Price">
            </a>
        </form>
    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
